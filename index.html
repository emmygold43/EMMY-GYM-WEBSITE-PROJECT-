    <script>
      // Browser extension / sandbox compatibility polyfill for window.fetch
      (function() {
        try {
          var _origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(newFetch) {
              _currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore
        }

        // Suppress unhandled errors from external browser extensions
        if (typeof window !== 'undefined') {
          window.addEventListener('error', function(event) {
            if (
              (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
              (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
            ) {
              event.preventDefault();
              event.stopPropagation();
              return true;
            }
          }, true);
        }
      })();
    </script>
